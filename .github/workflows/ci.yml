name: CI Pipeline

on:
  push:
    branches: [ develop, main, 'feature/**' ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite (Java 21 & PostgreSQL Flyway)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      # Separate step so a wrapper/Maven-download failure is distinguishable
      # from a build or test failure in the job summary.
      - name: Show Java and Maven versions
        working-directory: backend
        run: |
          java -version
          ./mvnw -B -v

      # `verify` = unit/H2 tests (surefire, *Test) + PostgreSQL 16 integration tests
      # (failsafe, *IT) via Testcontainers: real Flyway db/postgresql track,
      # ddl-auto=validate, exclusion constraint, concurrency and webhook idempotency.
      # GitHub-hosted ubuntu runners ship Docker, so the ITs are never skipped here.
      - name: Unit + PostgreSQL integration tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend-check:
    name: Frontend Quality & Build (Next.js 15 & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Vitest test suite
        working-directory: frontend
        run: npm test -- --run

      - name: Run Next.js production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
