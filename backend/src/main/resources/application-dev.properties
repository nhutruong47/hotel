# ============================================================
# Development Configuration
# Activated by default or with SPRING_PROFILES_ACTIVE=dev
# ============================================================

spring.application.name=hotel

# H2 Database (in-memory for dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (enabled for dev debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=${SERVER_PORT:8080}

# Application
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Admin credentials for development (WEAK PASSWORD - DEV ONLY!)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}

# CORS for dev
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8080,http://127.0.0.1:5173}

# Session cookie (dev mode - less restrictive)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Security (dev mode)
app.security.tls-only=false
app.security.hsts-max-age=0

# Rate limiting (relaxed for dev)
app.security.rate-limit.requests=${APP_RATE_LIMIT_REQUESTS:200}
app.security.rate-limit.window-ms=${APP_RATE_LIMIT_WINDOW_MS:60000}

# Upload directory
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# Email (dev mode - console logging only)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}

# Gemini AI (disabled by default in dev)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.0-flash}

# ============= STRIPE PAYMENT (Dev) =============
# Set STRIPE_SECRET_KEY to enable real Stripe payments in dev
# Leave empty for mock mode (default)
stripe.enabled=${STRIPE_ENABLED:false}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.api-version=2024-12-18.acacia

# Logging (verbose for dev)
logging.level.root=INFO
logging.level.com.hsf.hotel=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
