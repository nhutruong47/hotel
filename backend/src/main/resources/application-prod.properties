# ============================================================
# Production overrides - SECURED CONFIGURATION
# Activate with SPRING_PROFILES_ACTIVE=prod
#
# ⚠️  CRITICAL: All connection strings, credentials, and secrets
# MUST be supplied via environment variables. The placeholders
# below are intentionally not defaulted to a working value.
# ============================================================

spring.application.name=hotel

# --- Database (PostgreSQL only in production) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — tuned for containerised workloads
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:50}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=hotel-pool

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# --- H2 console MUST be off in production ---
spring.h2.console.enabled=false

# --- Server ---
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Cookies / sessions (HTTPS ONLY - SECURE) ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=${SESSION_COOKIE_DOMAIN:}

# --- CORS: explicitly list trusted origins (NO DEFAULTS) ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.base-url=${APP_BASE_URL}

# --- Security hardening ---
app.security.tls-only=true
app.security.hsts-max-age=${APP_HSTS_MAX_AGE:31536000}
app.webhook.secret=${APP_WEBHOOK_SECRET}

# --- Admin credentials (MUST BE SET - NO DEFAULTS) ---
# The application will refuse to start if these are not set in production
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}

# --- Rate limiting ---
app.security.rate-limit.requests=${APP_RATE_LIMIT_REQUESTS:120}
app.security.rate-limit.window-ms=${APP_RATE_LIMIT_WINDOW_MS:60000}

# --- Email (SMTP Configuration - REQUIRED in production) ---
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# --- App Email Settings ---
app.email.enabled=true
app.admin.email=${APP_ADMIN_EMAIL}

# --- Stripe Payment Gateway ---
stripe.enabled=true
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.api-version=2024-12-18.acacia

# --- Logging ---
logging.level.root=INFO
logging.level.com.hsf.hotel=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true
