spring.application.name=hotel

# H2 Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Spring Web (no Thymeleaf — pure REST + SPA static)
spring.main.banner-mode=off
spring.web.resources.add-mappings=false

# Server Configuration
server.port=${SERVER_PORT:8080}

# ============= WORKFLOW CONFIGURATION =============

# Application Base URL (for email links)
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Admin email for notifications
app.admin.email=${APP_ADMIN_EMAIL:admin@hotel.com}

# Admin bootstrap credentials (provisioned on first boot by DataInitializer).
# Override with APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD environment variables in production.
# Refuses to boot if the default is still in use outside of "dev".
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Payment deadline in hours after booking approval
app.booking.payment-deadline-hours=${APP_BOOKING_DEADLINE_HOURS:24}

# CORS allowed origins (comma-separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8080}

# Session cookie security (set true in production behind HTTPS)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Webhook signing secret — used by GatewaySignatureFilter to verify
# payment-gateway callbacks. MUST be set in production via env var.
app.webhook.secret=${APP_WEBHOOK_SECRET:}

# Security header behaviour — turn on HSTS in production
app.security.tls-only=${APP_TLS_ONLY:false}
app.security.hsts-max-age=${APP_HSTS_MAX_AGE:31536000}

# Rate limit defaults (per IP, per window)
app.security.rate-limit.requests=${APP_RATE_LIMIT_REQUESTS:60}
app.security.rate-limit.window-ms=${APP_RATE_LIMIT_WINDOW_MS:60000}

# Upload directory
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# ============= EMAIL CONFIGURATION =============
# Enable/disable email sending (falls back to logging if disabled)
app.email.enabled=${APP_EMAIL_ENABLED:true}

# Email sender identity
spring.mail.username=${SMTP_USERNAME:noreply@nhu-villas.com}
spring.mail.from-name=${SMTP_FROM_NAME:Nhu Villas}

# SMTP Server Configuration
# For Gmail: Enable 2FA and use App Password
# For SendGrid: Use API key as password
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# For testing with Mailtrap (recommended for development)
# Register at https://mailtrap.io for free sandbox
# spring.mail.host=sandbox.smtp.mailtrap.io
# spring.mail.port=2525
# spring.mail.username=your-mailtrap-username
# spring.mail.password=your-mailtrap-password

# ============= GEMINI AI CONFIGURATION =============
# IMPORTANT: Set GEMINI_API_KEY env var in production. Never commit real keys.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.0-flash}

# ============= STRIPE PAYMENT CONFIGURATION =============
# Enable/disable Stripe integration (falls back to mock if not configured)
stripe.enabled=${STRIPE_ENABLED:true}
# Stripe secret key - get from https://dashboard.stripe.com/apikeys
# Use sk_test_... for testing, sk_live_... for production
stripe.secret-key=${STRIPE_SECRET_KEY:}
# Stripe webhook secret - get from https://dashboard.stripe.com/webhooks
# Format: whsec_...
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Stripe API version (default: 2024-12-18.acacia)
stripe.api-version=2024-12-18.acacia

# ============= OBSERVABILITY & RUNTIME =============
# Server compression for /api/* responses
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024

# Tomcat Keep-Alive for TCP Optimization
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=2000

# Tomcat Thread Tuning for High Concurrency
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50

# Graceful shutdown: give in-flight requests up to 30 seconds to drain.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Allow long-running AI recommendation requests.
spring.mvc.async.request-timeout=60s

# Actuator is enabled so the health endpoint can be probed by containers
# and operations tools. Only /actuator/health is public; everything else
# stays protected by the existing /api/v1/** rules.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=${spring.application.name}
info.app.description=Direct booking experience for private villa stays.
