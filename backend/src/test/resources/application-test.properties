# Test profile configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Random port for tests
server.port=0

# Admin credentials for tests
app.admin.username=testadmin
app.admin.password=testpass123

# Disable scheduler in tests
spring.main.lazy-initialization=true

# Do not call real SMTP from integration tests
app.email.enabled=false

# Logging
logging.level.com.hsf.hotel=WARN
logging.level.org.springframework.test=INFO

# Unit/integration tests invoke the dispatcher explicitly where needed.
app.notification.outbox.enabled=false

# Tests run without SMTP
app.auth.auto-verify-without-email=true

# All test traffic comes from 127.0.0.1: rate limits are covered by RateLimitFilterTest
app.security.rate-limit.requests=100000
app.security.rate-limit.sensitive-requests=100000

# H2 schema comes from entities (create-drop). PostgreSQL migrations are tested by *IT classes.
spring.flyway.enabled=false
