# SPA fallback + reverse proxy for the Spring Boot API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    sendfile on;

    # Long cache for hashed bundles; short cache for index for quick deploys.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy the API and uploads to the backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # React Router SPA fallback - serve index.html for unmatched routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
