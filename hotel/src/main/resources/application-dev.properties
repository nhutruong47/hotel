# Local development overrides — development-only settings
# Production uses environment variables directly; this file is loaded when
# spring.profiles.active=dev (set via SPRING_PROFILES_ACTIVE=dev or IDE run config).

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.cookie.secure=false

# Dev DB credentials. Override via env vars in other environments.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin@123}