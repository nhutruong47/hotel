# ============================================================
# Production overrides
# Activate with SPRING_PROFILES_ACTIVE=prod
#
# All connection strings, credentials, and secrets MUST be supplied via
# environment variables. The placeholders below are intentionally not
# defaulted to a working value so that a misconfigured deploy fails loudly
# rather than silently connecting to an in-memory or default instance.
# ============================================================

spring.application.name=hotel

# --- Database (PostgreSQL only in production) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — tuned for containerised workloads. Max-pool-size scales with
# available CPUs; the default of 10 is sensible for the modest workload.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=hotel-pool

# --- JPA / Hibernate ---
# 'validate' refuses to boot if schema doesn't match the entities. Schema
# changes are managed exclusively via Flyway (see db/migration/V*.sql).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# --- H2 console MUST be off in production ---
spring.h2.console.enabled=false

# --- Server ---
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Cookies / sessions (HTTPS only) ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- CORS: explicitly list trusted origins; no defaults ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# --- Security hardening ---
app.security.tls-only=true
app.security.hsts-max-age=${APP_HSTS_MAX_AGE:31536000}
app.webhook.secret=${APP_WEBHOOK_SECRET}

# --- Rate limit defaults (per IP, per window) ---
app.security.rate-limit.requests=${APP_RATE_LIMIT_REQUESTS:120}
app.security.rate-limit.window-ms=${APP_RATE_LIMIT_WINDOW_MS:60000}

# --- Logging (env-overridable) ---
logging.level.root=INFO
logging.level.com.hsf.hotel=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
# Emit structured JSON for log aggregators (Loki, ELK, etc).
# Toggle by setting LOG_FORMAT=json (default plain for local logs).
logging.pattern.console=${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n}

# --- Actuator ---
# /actuator/health + /actuator/info are the only endpoints exposed. Everything
# else (heap dump, env, beans, …) stays behind the firewall.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true