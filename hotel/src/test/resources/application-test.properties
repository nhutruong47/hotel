# Test-only Spring profile.
# Uses H2 in-memory database so the context-load test runs anywhere
# without requiring external services.

# Override all datasource-related env vars to empty so the defaults below win.
SPRING_DATASOURCE_URL=
SPRING_DATASOURCE_USERNAME=
SPRING_DATASOURCE_PASSWORD=

spring.datasource.url=jdbc:h2:mem:hoteldb;MODE=SQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable external integrations that would fail in unit tests.
spring.mail.host=localhost
spring.mail.port=0
gemini.api.key=test-key