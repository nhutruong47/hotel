# Test profile configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Random port for tests
server.port=0

# Admin credentials for tests
app.admin.username=testadmin
app.admin.password=testpass123

# Disable scheduler in tests
spring.main.lazy-initialization=true

# Do not call real SMTP from integration tests
app.email.enabled=false

# Logging
logging.level.com.hsf.hotel=WARN
logging.level.org.springframework.test=INFO
