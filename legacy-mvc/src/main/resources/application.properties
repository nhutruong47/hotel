spring.application.name=hotel

# SQL Server Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=HotelDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Server Configuration
server.port=${SERVER_PORT:8080}

# ============= WORKFLOW CONFIGURATION =============

# Application Base URL (for email links)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Admin email for notifications
app.admin.email=${APP_ADMIN_EMAIL:admin@hotel.com}

# Payment deadline in hours after booking approval
app.booking.payment-deadline-hours=${APP_BOOKING_DEADLINE_HOURS:24}

