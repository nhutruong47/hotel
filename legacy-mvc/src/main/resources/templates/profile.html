<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile - Như Hotel</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; margin:0; }
        .navbar { background: rgba(255,255,255,0.06); padding:12px 28px; display:flex; justify-content:space-between; align-items:center; color:#fff; }
        .container { max-width:1100px; margin:36px auto; padding:0 20px; }
        .card { background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(3,7,18,0.18); overflow:hidden; display:flex; gap:0; }
        .card-grid { display:grid; grid-template-columns: 320px 1fr; width:100%; }
        .aside { background:linear-gradient(180deg,#f7fafc 0%, #fff 100%); padding:28px; }
        .main { padding:28px 32px; }
        .avatar-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; }
        .avatar { width:140px; height:140px; border-radius:12px; overflow:hidden; background:#e6eefc; display:flex; align-items:center; justify-content:center; font-size:48px; color:#2b6cb0; }
        .meta { width:100%; margin-top:6px; }
        .meta p { margin:6px 0; color:#334155; font-size:14px; }
        form { width:100%; }
        .field { margin-bottom:14px; }
        label { display:block; margin-bottom:6px; color:#334155; font-weight:600; font-size:14px; }
        input[type=text], input[type=email] { width:100%; padding:12px 14px; border:1px solid #e6eef6; border-radius:8px; background:#fff; color:#0f172a; }
        .file-row { display:flex; gap:10px; align-items:center; }
        .file-name { color:#64748b; font-size:14px; }
        .actions { display:flex; gap:12px; margin-top:18px; align-items:center; }
        .btn { padding:10px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
        .btn-primary { background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; box-shadow:0 8px 20px rgba(79,70,229,0.18); }
        .btn-secondary { background:#eef2ff; color:#3730a3; }
        .btn-link { background:transparent; color:#6b7280; border:none; text-decoration:underline; cursor:pointer; }
        .messages { margin-bottom:12px; }
        .success { background:#ecfccb; color:#166534; padding:10px 12px; border-radius:8px; }
        .error { background:#fee2e2; color:#991b1b; padding:10px 12px; border-radius:8px; }
        @media (max-width:900px) {
            .card-grid { grid-template-columns: 1fr; }
            .aside { padding:20px; }
            .main { padding:20px; }
            .avatar { width:110px; height:110px; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="display:flex;align-items:center;gap:12px">
            <div style="font-size:20px">🏨</div>
            <div style="font-weight:700">Như Hotel</div>
        </div>
        <div style="opacity:0.95; display:flex; gap:12px; align-items:center">
            <a th:href="@{/}" style="color:#fff; text-decoration:none;">Home</a>
            <a th:href="@{/logout}" style="color:#fff; text-decoration:none;">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-grid">
                <aside class="aside">
                    <div class="avatar-wrap">
                        <div class="avatar">
                            <img th:if="${user.avatarFilename}" th:src="@{/uploads/{file}(file=${user.avatarFilename})}" alt="avatar" style="width:100%;height:100%;object-fit:cover;display:block;" />
                            <span th:unless="${user.avatarFilename}" th:text="${user.fullName != null ? user.fullName.substring(0,1) : (user.username != null ? user.username.substring(0,1) : 'U')}">U</span>
                        </div>
                        <div style="text-align:center;">
                            <div style="font-weight:700;color:#0f172a;" th:text="${user.fullName ?: user.username}">Username</div>
                            <div style="color:#475569;font-size:13px;" th:text="${user.email}">email@example.com</div>
                        </div>
                        <div class="meta">
                            <p><strong>Role:</strong> <span th:text="${user.role}">USER</span></p>
                            <p><strong>Member since:</strong> <span th:text="${user.createdAt}">date</span></p>
                        </div>
                    </div>
                </aside>

                <main class="main">
                    <div class="messages">
                        <div th:if="${success}" class="success" th:text="${success}"></div>
                        <div th:if="${error}" class="error" th:text="${error}"></div>
                    </div>

                    <form th:action="@{/profile}" method="post" enctype="multipart/form-data">
                        <div class="field">
                            <label for="fullName">Full name</label>
                            <input type="text" id="fullName" name="fullName" th:value="${profile.fullName}" />
                        </div>

                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" th:value="${profile.email}" />
                        </div>

                        <div class="field">
                            <label>Avatar</label>
                            <div class="file-row">
                                <input type="file" id="avatar" name="avatar" style="display:none" accept="image/*" onchange="onFileSelected(event)" />
                                <button type="button" class="btn btn-secondary" onclick="document.getElementById('avatar').click()">Choose file</button>
                                <div class="file-name" id="fileLabel" th:text="${user.avatarFilename != null} ? ${user.avatarFilename} : 'No file chosen'">No file chosen</div>
                                <div style="margin-left:auto;">
                                    <a th:href="@{/change-password}" class="btn btn-link">Change password</a>
                                </div>
                            </div>
                        </div>

                        <div style="display:flex;gap:12px;align-items:center;">
                            <button class="btn btn-primary" type="submit">Save profile</button>
                            <a class="btn btn-secondary" th:href="@{/}">Back to home</a>
                        </div>
                    </form>
                </main>
            </div>
        </div>
    </div>

    <script>
        function onFileSelected(evt) {
            var input = evt.target;
            var label = document.getElementById('fileLabel');
            if (input.files && input.files.length) {
                label.textContent = input.files[0].name;
                // preview (optional): replace avatar img src
                var reader = new FileReader();
                reader.onload = function(e){
                    var img = document.querySelector('.avatar img');
                    if (img) img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                label.textContent = 'No file chosen';
            }
        }
    </script>
</body>
</html>
