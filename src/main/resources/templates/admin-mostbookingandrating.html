<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Báo cáo - Như Hotel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
        }

        .sidebar-header {
            color: #e94560;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
        }

        .sidebar-menu a.active {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-weight: 500;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-menu span {
            color: #94a3b8;
        }

        .user-menu a {
            background: #e94560;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }

        .user-menu a:hover {
            background: #c73e54;
        }

        .report-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .table-section {
            background: linear-gradient(145deg, #1e293b, #16213e);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }

        .table-section h2 {
            color: white;
            margin-bottom: 20px;
            font-weight: 500;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 12px;
        }

        td {
            color: white;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">🏨 Admin Panel</div>
        <div class="sidebar-menu">
            <a href="/admin">📊 Dashboard</a>
            <a href="/admin/reports" class="active">📈 Most Booking & Rating</a>
            <a href="/admin/bookings">📋 Manage Bookings</a>
            <a href="/admin/rooms">🛏️ Manage Rooms</a>
            <a href="/admin/users">👥 Manage Users</a>
            <a href="/admin/vouchers">🎟️ Manage Vouchers</a>
            <a href="/">🏠 Go to Homepage</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>📈 Báo cáo</h1>
            <div class="user-menu">
                <span th:if="${session.user != null}">Xin chào, <span
                        th:text="${session.user.fullName != null ? session.user.fullName : session.user.username}">Admin</span></span>
                <a href="/logout">Đăng xuất</a>
            </div>
        </div>

        <div class="report-container">
            <div class="table-section">
                <h2>Phòng được đặt nhiều nhất</h2>
                <canvas id="mostBookedChart" width="400" height="200"></canvas>
            </div>

            <div class="table-section">
                <h2>Phòng được đánh giá cao nhất</h2>
                <canvas id="topRatedChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const mostBookedData = /*[[${mostBookedRooms}]]*/ null;
        const topRatedData = /*[[${topRatedRooms}]]*/ null;

        // Chart for Most Booked Rooms
        if (mostBookedData && mostBookedData.length > 0) {
            const mostBookedCtx = document.getElementById('mostBookedChart').getContext('2d');
            const mostBookedLabels = mostBookedData.map(item => 'Phòng ' + item[0].roomNumber);
            const mostBookedValues = mostBookedData.map(item => item[1]);

            new Chart(mostBookedCtx, {
                type: 'bar',
                data: {
                    labels: mostBookedLabels,
                    datasets: [{
                        label: 'Số lần đặt',
                        data: mostBookedValues,
                        backgroundColor: 'rgba(233, 69, 96, 0.6)',
                        borderColor: 'rgba(233, 69, 96, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#94a3b8'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#94a3b8'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#94a3b8'
                            }
                        }
                    }
                }
            });
        } else {
            const mostBookedCtx = document.getElementById('mostBookedChart').getContext('2d');
            mostBookedCtx.font = "16px 'Segoe UI'";
            mostBookedCtx.fillStyle = '#94a3b8';
            mostBookedCtx.textAlign = 'center';
            mostBookedCtx.fillText("Chưa có dữ liệu.", 200, 100);
        }

        // Chart for Top Rated Rooms
        if (topRatedData && topRatedData.length > 0) {
            const topRatedCtx = document.getElementById('topRatedChart').getContext('2d');
            const topRatedLabels = topRatedData.map(item => 'Phòng ' + item[0].roomNumber);
            const topRatedValues = topRatedData.map(item => item[1]);

            new Chart(topRatedCtx, {
                type: 'polarArea',
                data: {
                    labels: topRatedLabels,
                    datasets: [{
                        label: 'Đánh giá',
                        data: topRatedValues,
                        backgroundColor: [
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)',
                            'rgba(75, 192, 192, 0.6)',
                            'rgba(153, 102, 255, 0.6)',
                            'rgba(255, 159, 64, 0.6)'
                        ]
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: {
                                color: 'rgba(255, 255, 255, 0.2)'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.2)'
                            },
                            pointLabels: {
                                color: '#94a3b8'
                            },
                            ticks: {
                                color: '#94a3b8',
                                backdropColor: 'transparent'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#94a3b8'
                            }
                        }
                    }
                }
            });
        } else {
            const topRatedCtx = document.getElementById('topRatedChart').getContext('2d');
            topRatedCtx.font = "16px 'Segoe UI'";
            topRatedCtx.fillStyle = '#94a3b8';
            topRatedCtx.textAlign = 'center';
            topRatedCtx.fillText("Chưa có dữ liệu.", 200, 100);
        }
        /*]]>*/
    </script>
