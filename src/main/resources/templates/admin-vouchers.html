<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Manage Vouchers - Admin</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1724;
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: #071029;
            padding: 20px;
            border-radius: 8px;
        }

        h1 {
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #0b1b2e;
        }

        th {
            text-align: left;
            color: #94a3b8;
        }

        .form-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .form-row input,
        .form-row select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #123;
            background: #071029;
            color: #fff;
        }

        .btn {
            background: linear-gradient(135deg, #0ea5a7, #0284c7);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .danger {
            background: #e11d48;
        }

        .small {
            font-size: 0.9em;
            color: #94a3b8;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            margin-top: 12px;
        }

        .alert-success {
            background: #063;
            color: #b6f0d6;
        }

        .alert-error {
            background: #300;
            color: #f8c6c6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧾 Manage Vouchers</h1>
        <a href="/admin" class="btn"
            style="margin-left:12px;background:linear-gradient(135deg,#64748b,#475569);padding:8px 12px;border-radius:6px;">←
            Back to Admin</a>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div>
            <form th:action="@{/admin/voucher}" method="post" class="form-row">

                <label class="small">Code: <input type="text" name="code" placeholder="Voucher code (e.g. PROMO10)"
                        required></label>
                <label class="small">Amount: <input type="number" name="amount" placeholder="Amount (if percent set %)"
                        required></label>
                <label class="small">Expiry: <input type="date" name="expiryDate"></label>
                <label class="small">Uses: <input type="number" name="quantity" placeholder="Uses" value="1"
                        min="1"></label>
                <label class="small"><input type="checkbox" name="percent" value="true"> Percentage</label>
                <button type="submit" class="btn">Create / Update</button>
            </form>
            <p class="small">Note: if <strong>Percentage</strong> is checked, <em>Amount</em> is treated as % (e.g. 10 =
                10%).
                10 = 10%).</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Amount</th>
                    <th>Percent</th>
                    <th>Expiry</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${vouchers}">
                    <td th:text="${v.id}"></td>
                    <td th:text="${v.code}"></td>
                    <td th:text="${v.amount}"></td>
                    <td th:text="${v.percent}"></td>
                    <td th:text="${v.expiryDate}"></td>
                    <td th:text="${v.quantity}"></td>
                    <td>
                        <form th:action="@{/admin/voucher/{id}/delete(id=${v.id})}" method="post"
                            style="display:inline">

                            <button type="submit" class="btn danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
