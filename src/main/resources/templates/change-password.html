<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Như Hotel</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; margin:0; }
        .navbar { background: rgba(255,255,255,0.06); padding:12px 28px; display:flex; justify-content:space-between; align-items:center; color:#fff; }
        .container { max-width:720px; margin:48px auto; padding:0 20px; }
        .card { background:#fff; border-radius:14px; box-shadow:0 18px 50px rgba(2,6,23,0.18); padding:28px; }
        .header { display:flex; gap:14px; align-items:center; margin-bottom:12px }
        .icon { width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#6ee7b7,#3b82f6);display:flex;align-items:center;justify-content:center;color:white;font-size:24px }
        h1 { margin:0; font-size:20px; color:#0f172a }
        p.lead { margin:2px 0 12px 0; color:#475569 }
        .messages { margin-bottom:14px }
        .flash { padding:10px 12px; border-radius:8px; font-weight:600 }
        .success { background:#ecfccb; color:#166534 }
        .error { background:#fee2e2; color:#991b1b }
        form { display:grid; gap:12px }
        label { font-weight:700; color:#334155; font-size:14px }
        .input-wrap { position:relative }
        input[type=password] { width:100%; padding:12px 44px 12px 12px; border:1px solid #e6eef6; border-radius:10px; outline:none; font-size:14px }
        input[type=password]:focus { box-shadow:0 8px 28px rgba(79,70,229,0.12); border-color:#7c3aed }
        .toggle { position:absolute; right:8px; top:6px; border:none; background:transparent; cursor:pointer; padding:8px; font-size:16px }
        .hint { font-size:13px; color:#64748b }
        .error-text { color:#b91c1c; font-size:13px }
        .actions { display:flex; gap:12px; align-items:center; margin-top:6px }
        .btn { padding:10px 16px; border-radius:10px; border:none; cursor:pointer; font-weight:700 }
        .btn-primary { background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff }
        .btn-secondary { background:#eef2ff; color:#3730a3 }
        @media (max-width:520px) { .container { margin:20px auto } }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="display:flex;align-items:center;gap:12px"><div style="font-size:20px">🏨</div><div style="font-weight:700">Như Hotel</div></div>
        <div style="display:flex;gap:12px;align-items:center"><a th:href="@{/}" style="color:#fff;text-decoration:none">Home</a><a th:href="@{/profile}" style="color:#fff;text-decoration:none">Profile</a></div>
    </div>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="icon">🔑</div>
                <div>
                    <h1>Change your password</h1>
                    <p class="lead">Protect your account by choosing a strong, unique password.</p>
                </div>
            </div>

            <div class="messages">
                <div th:if="${success}" class="flash success" th:text="${success}"></div>
                <div th:if="${error}" class="flash error" th:text="${error}"></div>
            </div>

            <form id="changeForm" th:action="@{/change-password}" method="post" onsubmit="return validateAndSubmit()">
                <div>
                    <label for="currentPassword">Current password</label>
                    <div class="input-wrap">
                        <input type="password" id="currentPassword" name="currentPassword" required />
                        <button type="button" class="toggle" onclick="toggle('currentPassword', this)">👁️</button>
                    </div>
                </div>

                <div>
                    <label for="newPassword">New password</label>
                    <div class="input-wrap">
                        <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters" required />
                        <button type="button" class="toggle" onclick="toggle('newPassword', this)">👁️</button>
                    </div>
                    <div class="hint">Use a unique password you don't use elsewhere.</div>
                    <div id="newPasswordError" class="error-text" style="display:none"></div>
                </div>

                <div>
                    <label for="confirmPassword">Confirm new password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" name="confirmPassword" required />
                        <button type="button" class="toggle" onclick="toggle('confirmPassword', this)">👁️</button>
                    </div>
                    <div id="confirmError" class="error-text" style="display:none"></div>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" id="submitBtn" type="submit">Change password</button>
                    <a class="btn btn-secondary" th:href="@{/profile}">Back to profile</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggle(id, btn) {
            var el = document.getElementById(id);
            if (!el) return;
            if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
            else { el.type = 'password'; btn.textContent = '👁️'; }
        }

        function validateAndSubmit() {
            var newPass = document.getElementById('newPassword').value || '';
            var confirm = document.getElementById('confirmPassword').value || '';
            var newErr = document.getElementById('newPasswordError');
            var cErr = document.getElementById('confirmError');
            var valid = true;
            newErr.style.display = 'none'; cErr.style.display = 'none';

            if (newPass.length < 6) {
                newErr.textContent = 'New password must be at least 6 characters.';
                newErr.style.display = 'block';
                valid = false;
            }
            if (newPass !== confirm) {
                cErr.textContent = 'Passwords do not match.';
                cErr.style.display = 'block';
                valid = false;
            }

            if (!valid) {
                document.getElementById('submitBtn').disabled = false;
                return false;
            }
            // allow form submit
            return true;
        }

        // auto-dismiss success flash after 3s
        (function(){
            var s = document.querySelector('.flash.success');
            if (s) setTimeout(function(){ s.style.display = 'none'; }, 3000);
        })();
    </script>
</body>
</html>
