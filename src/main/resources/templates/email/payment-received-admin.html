<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Payment Successful - Admin</title>
</head>

<body style="font-family: 'Segoe UI', sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px;">
    <div
        style="max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <!-- Header -->
        <div style="background: linear-gradient(135deg, #28a745, #20c997); padding: 30px; text-align: center;">
            <h1 style="color: white; margin: 0; font-size: 28px;">💰 Payment Successful!</h1>
            <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">Booking #<span th:text="${booking.id}">123</span>
            </p>
        </div>

        <!-- Content -->
        <div style="padding: 30px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <span
                    style="display: inline-block; background: #d4edda; color: #155724; padding: 10px 20px; border-radius: 20px; font-weight: 600;">
                    ✅ Payment Received
                </span>
            </div>

            <p style="color: #666; line-height: 1.6; text-align: center;">
                The guest confirmed payment at <strong th:text="${paidAt}">20/01/2026 14:30</strong>
            </p>

            <!-- Booking Details -->
            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h3 style="margin-top: 0; color: #333;">📋 Booking Details</h3>
                <table style="width: 100%; color: #666;">
                    <tr>
                        <td style="padding: 8px 0;"><strong>Guest:</strong></td>
                        <td style="padding: 8px 0;" th:text="${booking.guestName}">Nguyễn Văn A</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px 0;"><strong>Room:</strong></td>
                        <td style="padding: 8px 0;"
                            th:text="${booking.room.roomNumber} + ' - ' + ${booking.room.roomType.displayName}">101 -
                            Deluxe</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px 0;"><strong>Check-in:</strong></td>
                        <td style="padding: 8px 0;" th:text="${checkInDate}">01/02/2026</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px 0;"><strong>Check-out:</strong></td>
                        <td style="padding: 8px 0;" th:text="${checkOutDate}">05/02/2026</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px 0;"><strong>Amount:</strong></td>
                        <td style="padding: 8px 0; color: #28a745; font-weight: bold;"
                            th:text="${#numbers.formatInteger(booking.totalPrice, 0, 'COMMA')} + ' VND'">1,000,000 VND
                        </td>
                    </tr>
                </table>
            </div>

            <div style="text-align: center; margin: 30px 0;">
                <a th:href="${adminLink}"
                    style="display: inline-block; padding: 15px 40px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">
                    View Details
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div style="background: #f8f9fa; padding: 20px; text-align: center; border-top: 1px solid #eee;">
            <p style="color: #999; margin: 0; font-size: 12px;">
                Automated email from Nhu Hotel system
            </p>
        </div>
    </div>
</body>

</html>
