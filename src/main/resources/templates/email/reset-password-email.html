<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Password Reset - Nhu Hotel</title>
</head>

<body>
    <p>Dear <span th:text="${user.fullName ?: user.username}">User</span>,</p>
    <p>We received a request to reset your password. Click the link below to set a new password. The link will expire
        shortly.</p>
    <p><a th:href="${resetLink}" th:text="${resetLink}">Reset password link</a></p>
    <p>If you did not request this, please ignore this email.</p>
    <p>Best regards,<br />Nhu Hotel</p>
</body>

</html>
