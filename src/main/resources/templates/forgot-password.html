<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Như Hotel</title>
    <style>
        * { box-sizing: border-box; margin:0; padding:0 }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; }
        .navbar { background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); padding:12px 40px; display:flex; justify-content:space-between; align-items:center; }
        .navbar h2 { color:white; font-weight:600 }
        .nav-links { display:flex; gap:16px; align-items:center }
        .nav-links a { color:white; text-decoration:none; padding:6px 12px; border-radius:18px }
        .user-info { color:#ecf0f1; font-weight:500; display:inline-flex; gap:8px; align-items:center }
        .container { padding:30px 40px; max-width:1000px; margin:0 auto; }
        .card { background:white; padding:22px; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,0.12); max-width:520px; margin:40px auto; }
        label { display:block; margin-bottom:6px; font-weight:600 }
        input[type=email] { width:100%; padding:10px; border:1px solid #e1e7ef; border-radius:6px }
        .actions { margin-top:15px; display:flex; gap:10px }
        .btn { padding:10px 14px; border-radius:6px; border:none; cursor:pointer }
        .btn-primary { background:#4f46e5; color:white }
        .btn-secondary { background:#e6eefc; color:#1f2937 }
        .messages { max-width:520px; margin:10px auto }
        .success { background:#e6ffed; color:#0b8a3e; padding:8px 12px; border-radius:6px }
        .error { background:#ffe6e6; color:#b70b0b; padding:8px 12px; border-radius:6px }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>🏨 Như Hotel</h2>
        <div class="nav-links" th:if="${session.user}">
            <a href="/">Trang chủ</a>
            <a href="/my-bookings">Đặt phòng của tôi</a>
            <a href="/ai-recommend">🤖 Trợ lý AI</a>
            <a href="/admin" th:if="${session.user.role == 'ADMIN'}" style="color:#f1c40f">⚙️ Admin</a>
            <a th:href="@{/profile}" class="user-info">Xin chào, <span th:text="${session.user.fullName ?: session.user.username}">Khách</span>!</a>
            <a href="/logout" class="btn btn-secondary" style="border:1px solid rgba(255,255,255,0.1);">Đăng xuất</a>
        </div>
    </div>
    <div class="container">
        <div class="messages">
            <div th:if="${success}" class="success" th:text="${success}"></div>
            <div th:if="${error}" class="error" th:text="${error}"></div>
        </div>
        <div class="card">
            <h2>Forgot Password</h2>
            <p>Enter your account email. If it exists, we'll send a reset link.</p>
            <form id="forgotForm" th:action="@{/forgot-password}" method="post" onsubmit="return validateForgot()">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" />
                <div id="emailError" style="display:none;color:#b91c1c;font-size:13px;margin-top:6px"></div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">Send reset link</button>
                    <a class="btn btn-secondary" th:href="@{/login}">Back to login</a>
                </div>
            </form>
            <script>
                function validateForgot() {
                    var email = document.getElementById('email').value || '';
                    var err = document.getElementById('emailError');
                    err.style.display = 'none';
                    var re = /^\S+@\S+\.\S+$/;
                    if (!re.test(email)) {
                        err.textContent = 'Please enter a valid email address.';
                        err.style.display = 'block';
                        return false;
                    }
                    return true;
                }
            </script>
        </div>
    </div>
</body>
</html>
