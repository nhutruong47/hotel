<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Như Hotel - Trang Chủ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        
        .navbar { 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px);
            padding: 15px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .navbar h2 { color: white; font-weight: 600; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 20px; transition: 0.3s; }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }
        .user-info { color: #ecf0f1; font-weight: 500; }
        .logout-btn { 
            color: #ff7675 !important; 
            border: 1px solid #ff7675; 
        }
        .logout-btn:hover { background: #ff7675 !important; color: white !important; }

        .container { padding: 30px 50px; }
        
        .page-header { 
            color: white; 
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header h3 { font-size: 1.8em; font-weight: 300; }

        .filter-bar {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 30px;
        }
        .filter-bar a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            transition: 0.3s;
        }
        .filter-bar a:hover, .filter-bar a.active {
            background: white;
            color: #667eea;
        }

        .room-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 25px; 
        }
        
        .room-card { 
            background: white; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .room-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .room-img { 
            width: 100%; 
            height: 200px; 
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white;
            font-size: 1.2em;
            font-weight: 300;
        }
        .room-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .room-details { padding: 20px; }
        .room-details h4 { 
            color: #333; 
            font-size: 1.3em;
            margin-bottom: 5px;
        }
        .room-type { 
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .room-desc { color: #666; font-size: 14px; margin-bottom: 15px; line-height: 1.5; }
        .price { 
            color: #e74c3c; 
            font-size: 1.4em; 
            font-weight: bold;
        }
        .price span { font-size: 14px; color: #999; font-weight: normal; }
        
        .btn-booking { 
            display: block; 
            text-align: center; 
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white; 
            padding: 14px; 
            text-decoration: none; 
            border-radius: 10px; 
            margin-top: 15px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-booking:hover { 
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(39, 174, 96, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: white;
        }
        .empty-state h3 { font-size: 1.5em; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="navbar">
    <h2>🏨 Như Hotel</h2>
    <div class="nav-links" th:if="${session.user}">
        <a href="/">Trang chủ</a>
        <a href="/my-bookings">Đặt phòng của tôi</a>
        <span class="user-info">Xin chào, <span th:text="${session.user.fullName ?: session.user.username}">Khách</span>!</span>
        <a href="/logout" class="logout-btn">Đăng xuất</a>
    </div>
</div>

<div class="container">
    <div class="page-header">
        <h3>🛏️ Danh sách phòng trống</h3>
        <div class="filter-bar">
            <a href="/" th:classappend="${selectedType == null} ? 'active' : ''">Tất cả</a>
            <a th:each="type : ${roomTypes}" 
               th:href="@{/rooms(type=${type})}"
               th:text="${type.displayName}"
               th:classappend="${selectedType == type} ? 'active' : ''">Type</a>
        </div>
    </div>

    <div class="room-grid" th:if="${rooms != null and !rooms.isEmpty()}">
        <div class="room-card" th:each="room : ${rooms}">
            <div class="room-img">
                <img th:if="${room.imageUrl}" th:src="${room.imageUrl}" alt="Room Image">
                <span th:unless="${room.imageUrl}" th:text="${room.roomType.displayName}">Ảnh Phòng</span>
            </div>
            <div class="room-details">
                <span class="room-type" th:text="${room.roomType.displayName}">Standard</span>
                <h4 th:text="'Phòng ' + ${room.roomNumber}">Phòng 101</h4>
                <p class="room-desc" th:text="${room.description ?: room.roomType.description}">Mô tả phòng</p>
                <p class="price">
                    <span th:text="${#numbers.formatDecimal(room.pricePerNight, 0, 'COMMA', 0, 'POINT')}">500,000</span> VNĐ
                    <span>/ đêm</span>
                </p>
                <a th:href="@{/booking/{id}(id=${room.id})}" class="btn-booking">🎯 Đặt phòng ngay</a>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${rooms == null or rooms.isEmpty()}">
        <h3>😔 Hiện tại không có phòng nào trống</h3>
        <p>Vui lòng quay lại sau hoặc liên hệ lễ tân để biết thêm thông tin.</p>
    </div>
</div>
</body>
</html>
