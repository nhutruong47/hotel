<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Reset Password - Nhu Hotel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .navbar h2 {
            color: white;
            font-weight: 600
        }

        .nav-links {
            display: flex;
            gap: 16px;
            align-items: center
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 18px
        }

        .container {
            padding: 30px 40px;
            max-width: 1000px;
            margin: 0 auto
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            max-width: 520px;
            margin: 40px auto
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600
        }

        input[type=password] {
            width: 100%;
            padding: 10px;
            border: 1px solid #e1e7ef;
            border-radius: 6px
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px
        }

        .btn {
            padding: 10px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer
        }

        .btn-primary {
            background: #4f46e5;
            color: white
        }

        .btn-secondary {
            background: #e6eefc;
            color: #1f2937
        }

        .messages {
            max-width: 520px;
            margin: 10px auto
        }

        .success {
            background: #e6ffed;
            color: #0b8a3e;
            padding: 8px 12px;
            border-radius: 6px
        }

        .error {
            background: #ffe6e6;
            color: #b70b0b;
            padding: 8px 12px;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h2>🏨 Nhu Hotel</h2>
        <div class="nav-links" th:if="${session.user}">
            <a href="/">Home</a>
            <a href="/my-bookings">My Bookings</a>
            <a href="/ai-recommend">🤖 AI Assistant</a>
            <a href="/admin" th:if="${session.user.role == 'ADMIN'}" style="color:#f1c40f">⚙️ Admin</a>
            <a th:href="@{/profile}" class="user-info">Hello, <span
                    th:text="${session.user.fullName ?: session.user.username}">Guest</span>!</a>
            <a href="/logout" class="btn btn-secondary" style="border:1px solid rgba(255,255,255,0.1);">Logout</a>
        </div>
    </div>
    <div class="container">
        <div class="messages">
            <div th:if="${success}" class="success" th:text="${success}"></div>
            <div th:if="${error}" class="error" th:text="${error}"></div>
        </div>
        <div class="card">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
                <div
                    style="width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#6ee7b7,#3b82f6);display:flex;align-items:center;justify-content:center;color:white;font-size:24px;">
                    🔒</div>
                <div>
                    <h2 style="margin:0 0 4px 0">Reset your password</h2>
                    <div style="color:#556; font-size:14px">Enter a new secure password for your account.</div>
                </div>
            </div>

            <form th:action="@{/reset-password}" method="post">
                <!-- Ưu tiên email (luồng mới) -->
                <input type="hidden" name="email" th:value="${email}" th:if="${email}" />
                <!-- Fallback: token (luồng cũ) -->
                <input type="hidden" name="token" th:value="${token}" th:if="${token}" />

                <!-- Hiển thị email đang reset -->
                <div th:if="${email}" style="background:#e0f2fe;padding:10px;border-radius:6px;margin-bottom:12px">
                    <span style="color:#0369a1">📧 Resetting password for: <strong th:text="${email}"></strong></span>
                </div>

                <div style="margin-top:12px">
                    <label for="newPassword" style="display:block;margin-bottom:8px;font-weight:600;color:#334155">New
                        Password</label>
                    <div style="position:relative">
                        <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters"
                            style="width:100%;padding:12px 44px 12px 12px;border:1px solid #e2e8f0;border-radius:8px;outline:none;transition:box-shadow .15s" />
                        <button type="button" onclick="toggleVisibility('newPassword', this)"
                            style="position:absolute;right:6px;top:6px;border:none;background:transparent;padding:6px;cursor:pointer">👁️</button>
                    </div>
                </div>

                <div style="margin-top:14px">
                    <label for="confirmPassword"
                        style="display:block;margin-bottom:8px;font-weight:600;color:#334155">Confirm New
                        Password</label>
                    <div style="position:relative">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Re-enter password"
                            style="width:100%;padding:12px 44px 12px 12px;border:1px solid #e2e8f0;border-radius:8px;outline:none;transition:box-shadow .15s" />
                        <button type="button" onclick="toggleVisibility('confirmPassword', this)"
                            style="position:absolute;right:6px;top:6px;border:none;background:transparent;padding:6px;cursor:pointer">👁️</button>
                    </div>
                </div>

                <div style="margin-top:18px;display:flex;gap:10px;align-items:center">
                    <button class="btn btn-primary" type="submit"
                        style="padding:12px 18px;border-radius:10px; font-weight:600;">Set New Password</button>
                    <a class="btn btn-secondary" th:href="@{/login}"
                        style="padding:10px 14px;border-radius:10px;text-decoration:none;">Back to Login</a>
                </div>
            </form>
            <script>
                function toggleVisibility(id, btn) {
                    var el = document.getElementById(id);
                    if (!el) return;
                    if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
                    else { el.type = 'password'; btn.textContent = '👁️'; }
                }
                // small focus style
                document.addEventListener('focusin', function (e) {
                    if (e.target.tagName === 'INPUT') e.target.style.boxShadow = '0 4px 18px rgba(59,130,246,0.08)';
                });
                document.addEventListener('focusout', function (e) {
                    if (e.target.tagName === 'INPUT') e.target.style.boxShadow = 'none';
                });
            </script>
        </div>
    </div>
</body>

</html>
