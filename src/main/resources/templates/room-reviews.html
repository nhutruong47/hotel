<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title th:text="'Đánh giá phòng ' + ${room.roomNumber} + ' - Như Hotel'">Đánh giá phòng</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .room-card {
            background: linear-gradient(145deg, #1e293b, #16213e);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(233, 69, 96, 0.2);
            margin-bottom: 30px;
            display: flex;
            gap: 25px;
        }

        .room-card img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
        }

        .room-info h2 {
            color: #e94560;
            margin-bottom: 10px;
        }

        .room-info p {
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .rating-summary {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .rating-big {
            font-size: 2.5em;
            color: white;
            font-weight: bold;
        }

        .rating-stars {
            color: #fbbf24;
            font-size: 1.5em;
        }

        .rating-count {
            color: #94a3b8;
            font-size: 14px;
        }

        .reviews-section {
            background: linear-gradient(145deg, #1e293b, #16213e);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }

        .reviews-section h2 {
            color: white;
            margin-bottom: 20px;
        }

        .review-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .reviewer-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reviewer-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .reviewer-name {
            color: white;
            font-weight: 500;
        }

        .review-date {
            color: #64748b;
            font-size: 12px;
        }

        .review-stars {
            color: #fbbf24;
            font-size: 18px;
        }

        .review-comment {
            color: #94a3b8;
            line-height: 1.6;
        }

        .no-reviews {
            text-align: center;
            color: #64748b;
            padding: 40px;
        }

        .no-reviews span {
            font-size: 3em;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📝 Đánh giá phòng</h1>
            <a href="/" class="back-btn">← Quay lại trang chủ</a>
        </div>

        <!-- Room Info Card -->
        <div class="room-card">
            <img th:src="${room.imageUrl != null ? room.imageUrl : 'https://via.placeholder.com/200x150'}" alt="Room">
            <div class="room-info">
                <h2 th:text="'Phòng ' + ${room.roomNumber}">Phòng 101</h2>
                <p th:text="${room.roomType.displayName}">Deluxe</p>
                <p th:text="${room.description}">Mô tả phòng</p>

                <div class="rating-summary">
                    <span class="rating-big" th:text="${avgRating}">4.5</span>
                    <div>
                        <div class="rating-stars">
                            <span th:each="i : ${#numbers.sequence(1, 5)}"
                                th:text="${i <= avgRating} ? '★' : '☆'">★</span>
                        </div>
                        <span class="rating-count" th:text="${reviewCount} + ' đánh giá'">10 đánh giá</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reviews List -->
        <div class="reviews-section">
            <h2>💬 Đánh giá từ khách hàng</h2>

            <div th:if="${reviews == null or reviews.isEmpty()}" class="no-reviews">
                <span>📭</span>
                <p>Chưa có đánh giá nào cho phòng này</p>
            </div>

            <div th:each="review : ${reviews}" class="review-item">
                <div class="review-header">
                    <div class="reviewer-info">
                        <div class="reviewer-avatar"
                            th:text="${review.user.fullName != null ? review.user.fullName.substring(0,1).toUpperCase() : review.user.username.substring(0,1).toUpperCase()}">
                            N
                        </div>
                        <div>
                            <div class="reviewer-name"
                                th:text="${review.user.fullName != null ? review.user.fullName : review.user.username}">
                                Nguyễn Văn A
                            </div>
                            <div class="review-date"
                                th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}">
                                01/01/2024
                            </div>
                        </div>
                    </div>
                    <div class="review-stars" th:text="${review.starsDisplay}">★★★★☆</div>
                </div>
                <p th:if="${review.comment != null and !review.comment.isEmpty()}" class="review-comment"
                    th:text="${review.comment}">
                    Nhận xét của khách hàng...
                </p>
            </div>
        </div>
    </div>
</body>

</html>
