<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thưởng Lãm Mỹ Học Quốc Phòng</title>
    <!-- Import Google Fonts for brush strokes and traditional look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Lora:ital,wght@0,400;0,600;1,400&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/aesthetics.css">
</head>
<body>
    <div class="page-wrapper">
        <h2 class="top-title">SAU KHI LÀM ĐẸP</h2>
        
        <div class="aesthetics-container">
            <!-- Left Section: Vintage Paper Text & Layout -->
            <div class="paper-section">
                
                <div class="main-title-container">
                    <h1 class="main-title">
                        <span class="small-text">THƯỞNG LÃM</span><br>
                        <span class="large-text">MỸ HỌC</span><br>
                        <span class="medium-text">QUỐC PHÒNG</span>
                    </h1>
                </div>

                <div class="timeline-container">
                    <svg class="dashed-line" viewBox="0 0 500 150" preserveAspectRatio="none">
                        <!-- Curvy path for timeline -->
                        <path d="M 30,20 Q 80,10 130,50 T 250,90 T 380,100" fill="transparent" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="6,5"/>
                    </svg>
                    
                    <div class="timeline-point point-1">
                        <div class="dot"></div>
                        <p class="point-text">Khái niệm cơ bản,<br>hình thái của<br>mỹ học quốc phòng</p>
                    </div>
                    
                    <div class="timeline-point point-2">
                        <div class="dot"></div>
                        <p class="point-text">Ý nghĩa phương Đông<br>linh hồn của<br>mỹ học quốc phòng</p>
                    </div>

                    <div class="timeline-point point-3">
                        <div class="dot"></div>
                        <p class="point-text">Truyền thụ tiếp nối,<br>sự tiếp nối của<br>mỹ học quốc phòng</p>
                    </div>
                </div>
            </div>
            
            <!-- Right Section: Traditional Painting -->
            <div class="painting-section"></div>
        </div>
    </div>
</body>
</html>
